<html lang="en"><head><meta charset="utf-8"><title>mem-mastero · Product walkthrough</title>

<script>

function rect(x,y,w,h,r=22,fill=C.panel,stroke=C.edge){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}

function fit(s,x,y,size,maxWidth,color=C.ink,weight=400,font=FONT,align='left'){c.font=`${weight} ${size}px ${font}`;const width=c.measureText(s).width;text(s,x,y,Math.min(size,size*maxWidth/Math.max(1,width)),color,weight,font,align)}
function line(x,y,x2,y2,color=C.edge,width=2){c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=width;c.stroke()}

function card(x,y,w,h,accent=C.mint){rect(x,y,w,h);rect(x,y+24,4,h-48,2,accent,null)}

function orbit(x,y,r,t){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.strokeStyle=C.edge;c.lineWidth=2;c.stroke();for(let i=0;i<3;i++){const a=t*.13+i*Math.PI*2/3;rect(x+Math.cos(a)*r-6,y+Math.sin(a)*r-6,12,12,4,C.mint,null)}}

    pill('Meaning-based search',128,710);pill('Automatic summaries',459,710);pill('Existing login',799,710,C.blue);

  // 6. Knowledge is distinct from original raw session backups.
  (u,d)=>{
    title('Keep the useful parts of your work.','Capture assistant observations as small, searchable project notes.');label('ILLUSTRATIVE EXAMPLE · NOT TERMINAL OUTPUT',128,341);
    rect(128,383,680,336);label('ASSISTANT OBSERVATION',164,430,C.blue);text('“We added exponential backoff',164,496,32,C.ink,500);text('to handle rate-limit responses.”',164,545,32,C.ink,500);line(164,589,772,589);text('A decision worth remembering.',164,649,29,C.dim);
    arrow(840,543,1009);packets(850,543,999,u);note(1050,383,742,'Rate-limit handling','Use exponential backoff for retryable requests.');note(1050,531,742,'Decision + source reference','Small records that can be searched and cited.',C.blue);
    rect(128,762,1664,81,14,'#172431');text('Original session backups stay separate from project knowledge.',164,814,31,C.dim);

  (u,d)=>{

    label('ILLUSTRATIVE EXAMPLE',128,338);['Retry behavior','Backoff decision','Validation result'].forEach((s,i)=>{rect(128,375+i*91,560,70,12,'#172432',null);text(s,153,420+i*91,29,C.ink,500);text(`note ${i+1}`,654,420+i*91,24,C.mint,400,MONO,'right')});
    arrow(718,500,886);packets(730,500,875,u);rect(928,375,864,282);label('AI SUMMARY',965,422,C.mint);text('Rate-limit handling',965,482,39,C.ink,600);text('Retry with backoff; preserve the test findings.',965,537,29,C.dim);pill('Source IDs: note 1 · note 2 · note 3',965,575,C.blue);
    cmd('memory ai-status',708);foot('Summaries are unverified model interpretations. Check the linked source notes.',840,C.amber);
  },

  (u,d)=>{
    title('Find past decisions with a natural question.','Hybrid search combines keywords with AI meaning-based ranking.');cmd('memory search "How did we handle rate limits?" --mode hybrid',329,26);
    rect(128,453,1664,189,19,'#142b2c',C.edge);label('ILLUSTRATIVE MATCH · PROJECT MEMORY',164,499,C.mint);text('Rate-limit handling: retries with exponential backoff',164,556,37,C.ink,600);text('Open the selected result to read its details and source references.',164,607,27,C.dim);
    cmd('memory get memory:<hash>',684);label('PLACEHOLDER: REPLACE memory:<hash> WITH THE COMPLETE ID RETURNED BY SEARCH',128,807);
    foot('AI ranking covers the current candidate page; archived transcript text is not searched here.',842);
  },

  (u,d)=>{
    title('See the storage cost before you act.','Measure local files, then preview eligible Claude sessions.');cmd('storage',328);label('ILLUSTRATIVE STORAGE VIEW · EXAMPLE DATA',128,462);
    const rows=[['Sessions & companions','2.4 GB',.36,C.mint],['Existing clones & Git history','4.1 GB',.62,C.blue],['Other Claude files','1.5 GB',.23,C.amber]];
    rows.forEach((r,i)=>{const y=500+i*66;text(r[0],128,y+26,27);rect(707,y,814,29,7,'#1c2b38',null);rect(707,y,Math.max(1,814*r[2]*ease(u/1.4)),29,7,r[3],null);text(r[1],1792,y+27,29,r[3],600,MONO,'right')});
    cmd('archive --dry-run',732);foot('Preview only: no local session is removed by a dry run.',842,C.mint);

  (u,d)=>{

    const names=['Upload','Download again','Verify every file','Remove locally'],sub=['Private GitHub repo','Independent cloud copy','Every file hash matches','Unchanged files only'];

    names.forEach((s,i)=>{const x=128+i*426,lit=i<=active;rect(x,494,386,221,19,lit?'#142b2c':C.panel,lit?'#386855':C.edge);text(String(i+1).padStart(2,'0'),x+28,547,27,lit?C.mint:C.dim,500,MONO);fit(s,x+28,610,32,330,C.ink,600);fit(sub[i],x+28,665,23,330,C.dim);if(i<active)tick(x+333,537);if(i<3)arrow(x+393,601,x+419,i<active?C.mint:C.edge)});

  (u,d)=>{

  },

  (u,d)=>{

    [['Project memory','Capture · Search · AI summaries',C.mint],['Session continuity','Sync across your machines',C.blue],['Safe Claude archives','Verify · Reference · Recall',C.amber]].forEach((r,i)=>{const x=128+i*570;card(x,504,524,165,r[2]);text(r[0],x+28,565,33,C.ink,600);fit(r[1],x+28,623,25,468,C.dim)});
    text('github.com/Shaf2665/mem-mastero',128,752,44,C.ink,600);text('Walkthrough + AI setup: docs/ai-memory.md',128,816,29,C.dim);pill('v0.13',1633,778);

function drawCaption(t){
  const cue=captions.find(q=>t>=q.start&&t<q.end);if(!cue)return;
  let size=39,rows;
  do{c.font=`600 ${size}px ${FONT}`;rows=[''];for(const word of cue.text.split(/\s+/)){const i=rows.length-1,s=(rows[i]+' '+word).trim();if(c.measureText(s).width>1560&&rows[i])rows.push(word);else rows[i]=s}if(rows.length<=2||size<=20)break;size-=1}while(true);
  const lineHeight=Math.ceil(size*1.26),h=rows.length*lineHeight+28,y=Math.max(900,1022-h),width=Math.min(1720,Math.max(...rows.map(r=>c.measureText(r).width))+68);
  rect((1920-width)/2,y,width,h,14,'rgba(3,8,13,.95)',null);rows.forEach((r,i)=>text(r,960,y+size+12+i*lineHeight,size,C.ink,600,FONT,'center'));
}
window.render=(time,options={})=>{const t=clamp(time,0,window.DURATION),i=currentScene(t),u=t-window.SCENES[i],d=window.SCENES[i+1]-window.SCENES[i];background(t);c.save();c.globalAlpha=ease(u/.28);c.translate(0,(1-ease(u/.4))*14);draw[i](u,d);c.restore();if(options.captions!==false)drawCaption(t)};
