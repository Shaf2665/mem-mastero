# Announces releases. A push to main that contains a "vX.Y.Z: ..." commit creates a GitHub Release and
# writes a one-click "Post on X" link into the run summary (both free). With secrets set it also posts to
# Bluesky (free) and through the X API (paid). Run it by hand (Actions > Announce > Run workflow) to
# announce your own text. Details in .github/announce.js.
name: Announce

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      text:
        description: Text to post (up to 280 characters, a link counts as 23; longer text is trimmed)
        required: true
      dry_run:
        description: Only show what would be posted
        type: boolean
        default: true

permissions:
  contents: write # to create the GitHub Release and its tag

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/announce.js
        env:
          # Passed through env, never inlined into the script: commit messages and inputs are untrusted text.
          COMMITS: ${{ toJSON(github.event.commits) }}
          TEXT: ${{ inputs.text }}
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ github.token }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
