# Announces releases on X. A push to main that contains a "vX.Y.Z: ..." commit posts
# "<repo name> vX.Y.Z is out: ..." with the repo link. Run it by hand (Actions > Post to X > Run workflow)
# to post your own text. Needs four repo secrets; see .github/post-to-x.js.
name: Post to X

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      text:
        description: Text to post (up to 280 characters, a link counts as 23; longer text is trimmed)
        required: true
      dry_run:
        description: Only print what would be posted
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/post-to-x.js
        env:
          # Passed through env, never inlined into the script: commit messages and inputs are untrusted text.
          COMMITS: ${{ toJSON(github.event.commits) }}
          TEXT: ${{ inputs.text }}
          DRY_RUN: ${{ inputs.dry_run }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
